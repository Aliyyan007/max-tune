# Render blueprint — web app + download worker on free tier.
# Shared secrets live in ONE env group — entered once at deploy, inherited by both.
envVarGroups:
  - name: maxtune-shared
    envVars:
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: APPLE_MEDIA_USER_TOKEN
        sync: false
      - key: AMAZON_SESSION_JSON
        sync: false
      - key: AMAZON_DEVICE_WVD_B64
        sync: false
      - key: AMAZON_MUSIC_TOKEN
        sync: false
      - key: SPOTIFY_SESSION_JSON
        sync: false
      - key: TIDAL_ACCESS_TOKEN
        sync: false
      - key: TIDAL_REFRESH_TOKEN
        sync: false
      - key: DEEZER_ARL
        sync: false
      - key: QOBUZ_APP_ID
        sync: false
      - key: QOBUZ_APP_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

services:
  - type: web
    name: max-tune
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - fromGroup: maxtune-shared
      - key: NODE_VERSION
        value: "22"
      - key: APPLE_WRAPPER_URL
        value: http://136.111.58.129:12340

  # free plan forbids background_worker — it runs as a web service that binds
  # $PORT with a health endpoint (also a pinger target for cold-start keep-alive)
  - type: web
    name: max-tune-worker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:worker && bash tools/provision-worker.sh
    startCommand: node worker.mjs
    healthCheckPath: /
    envVars:
      - fromGroup: maxtune-shared
      - key: NODE_VERSION
        value: "22"
      - key: WORKER_CAPS
        value: generic,apple
      - key: APPLE_WRAPPER_URL
        value: http://136.111.58.129:12340
